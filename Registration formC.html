<html>
<head>
     <title> Student Registration Form </title>
</head>
<body>
     <h2> Student Registration Form </h2>

<form>
      Name:
          <input type="text" name="Name"><br><br>
      Email:
          <input type="email" name="email"><br><br>
      Gender:
          <input type="radio" name="gender"> Male 
          <input type="radio" name="gender"> Female <br><br>
      Hobbies:
          <input type="checkbox"> Reading 
          <input type="checkbox"> Travelling 
          <input type="checkbox"> Sports <br><br>
 
          Branch:
             <select>
                 <option> --Select-- </option>
                 <option> Computer Science </option>
                 <option> Information Technology </option>
                 <option> Electronics </option>
             </select> 

          Semister:
               <select>
                   <option> --Select-- </option>
                   <option> I </option>
                   <option> II </option>
                   <option> III </option> 
                   <option> IV </option>
                   <option> V </option>
                   <option> VI </option>
                   <option> VII </option>
                   <option> VIII </option>
               </select>

          Section:
              <select>
                  <option> --Select-- </option>
                  <option> A </option>
                  <option> B </option>
                  <option> C </option>
                  <option> D </option>
                  <option> E </option>
              </select> <br><br>

          Address:<br>
                  <textarea rows="4" cols="30"> </textarea> <br><br><br><br><br>
               
          <input type="Submit" value="Register">
</form>
</body>
</html>
